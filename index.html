<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>
  <style>
    :root{
      --page:#0d0d0d; --panel:#181c15; --border:rgba(255,255,255,0.10);
      --ink:#f2f2f0; --ink-2:#a9ada4; --accent:#4fd1ff; --good:#7fd97f;
    }
    *{box-sizing:border-box}
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
      background:var(--page); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #app { position:fixed; inset:0; line-height:0; overflow:hidden; }
    .sidebar {
      position:fixed; top:20px; width:220px; max-height:calc(100vh - 40px); overflow-y:auto;
      display:flex; flex-direction:column; gap:16px; z-index:4;
    }
    .sidebar-left { left:20px; }
    .sidebar-right { right:20px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px;
      box-shadow:0 10px 28px rgba(0,0,0,.5); }
    .panel h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-2); }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:8px;
      cursor:pointer; user-select:none; }
    .panel-head h2 { margin:0 0 10px; }
    .collapse-arrow { flex:0 0 auto; color:var(--ink-2); font-size:10px; margin-bottom:10px;
      transition:transform .15s ease; }
    .panel.collapsed .panel-head h2, .panel.collapsed .collapse-arrow { margin-bottom:0; }
    .panel.collapsed .collapse-arrow { transform:rotate(-90deg); }
    .panel.collapsed .panel-body { display:none; }
    .stat { display:flex; justify-content:space-between; padding:4px 0; font-variant-numeric:tabular-nums; }
    .stat .label { color:var(--ink-2); }
    .stat .val { font-weight:650; }
    #recipes { display:flex; flex-direction:column; gap:8px; }
    .recipe { display:block; width:100%; text-align:left; background:var(--page); color:var(--ink);
      border:1px solid var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; font-family:inherit; }
    .recipe:hover:not(:disabled) { border-color:var(--accent); }
    .recipe:disabled { opacity:.45; cursor:default; }
    .recipe.done { border-color:var(--good); opacity:.75; }
    .recipe.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .rname { font-weight:650; font-size:13px; }
    .rdesc { font-size:11px; color:var(--ink-2); margin-top:2px; }
    .rcost { font-size:11px; color:var(--accent); margin-top:4px; }
    #buildings { display:flex; flex-direction:column; gap:8px; }
    .hint { font-size:11px; color:var(--ink-2); margin:-4px 0 10px; }
    #dayNight {
      position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:3; pointer-events:none;
      background:rgba(0,0,0,0.45); border:1px solid var(--border); border-radius:20px;
      padding:5px 12px; font-size:12px; font-weight:650; letter-spacing:.03em; color:var(--ink);
      transition:background-color .4s ease;
    }
    #dayNight.night { background:rgba(0,0,0,0.6); color:#c7d3ff; }
    .chest-menu {
      position:absolute; z-index:5; width:200px; background:var(--panel); color:var(--ink);
      border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12px;
      box-shadow:0 8px 24px rgba(0,0,0,.45);
    }
    .chest-head { display:flex; justify-content:space-between; align-items:center; font-weight:650; margin-bottom:8px; }
    .chest-close { background:transparent; border:0; color:var(--ink-2); font-size:16px; line-height:1;
      padding:0 2px; cursor:pointer; }
    .chest-close:hover { color:var(--ink); }
    .chest-row { display:grid; grid-template-columns:1fr auto auto auto auto; align-items:center; gap:6px; padding:4px 0; }
    .chest-res { font-weight:600; }
    .chest-amt { color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .chest-row button { width:22px; height:22px; border:1px solid var(--border); background:var(--page);
      color:var(--ink); border-radius:6px; cursor:pointer; font-family:inherit; }
    .chest-row button:hover:not(:disabled) { border-color:var(--accent); }
    .chest-row button:disabled { opacity:.35; cursor:default; }
    .chest-remove { margin-top:8px; width:100%; border:1px dashed var(--border); background:transparent;
      color:var(--ink-2); border-radius:8px; padding:6px; font-family:inherit; font-size:11px; cursor:pointer; }
    .chest-remove:hover { color:#e86a6a; border-color:#e86a6a; }
  </style>
</head>
<body>
  <div id="app">
    <div id="dayNight">Day</div>
  </div>
  <div class="sidebar sidebar-left">
    <div class="panel">
      <h2>Inventory</h2>
      <div id="inventory"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h2>Craft</h2>
        <span class="collapse-arrow">&#9662;</span>
      </div>
      <div class="panel-body">
        <div id="recipes"></div>
      </div>
    </div>
  </div>
  <div class="sidebar sidebar-right">
    <div class="panel">
      <div class="panel-head">
        <h2>Build</h2>
        <span class="collapse-arrow">&#9662;</span>
      </div>
      <div class="panel-body">
        <p class="hint" id="buildHint"></p>
        <div id="buildings"></div>
        <p class="hint" style="margin:10px 0 0">Right-click any placed structure to remove it (a Chest opens its storage instead). Click a Door to open or close it, or a grown Garden Bed to harvest Fiber.</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
